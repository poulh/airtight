# Development only. The plugin runs its tools through plugins/airtight/bin, which
# puts plugins/airtight on PYTHONPATH; this file just declares the dependency so
# ./setup.sh can build a .venv for working on the plugin in this repo.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airtight"
version = "0.1.0"
description = "You can't code autonomously if you don't have airtight requirements."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[tool.setuptools]
package-dir = { "" = "plugins/airtight" }
packages = ["airtight"]
