# Convergence Pipeline — project configuration
#
# THE SINGLE SOURCE OF TRUTH. cp-init reads this file and builds the project
# database from it; the tools then read their rules back out of the database.
# No rule about this pipeline is written in Python, and none is written only in
# prose. If a fact describes a thing, it is stored on that thing:
#
#   "only the human decides a goal"      -> requirement_kinds.goal.decided_by
#   "an accepted answer names ids"       -> answer_kinds.accepted.requires
#   "Tina owns the milestone split"      -> agents.ttm.owns
#   "a thread stalls after 4 replies"    -> policy.stall_replies
#
# Descriptions are shown to agents when they choose a value, so write them for
# a reader. Run cp-doctor after editing: it cross-checks this file against the
# charters and the schema and reports anything that has drifted.

# ---------------------------------------------------------------- the phases

phases:
  - number: 1
    key: converge
    name: Converge
    ends_when: >
      No open concerns, and every active agent has signed off on the current
      requirement set.
  - number: 2
    key: architect
    name: Architect
    ends_when: >
      architecture.md is written against the whole accepted requirement set and
      no objection to it is outstanding.
  - number: 3
    key: slice
    name: Slice
    ends_when: >
      Deliverables and the first deliverable's milestones are agreed, the
      architect has passed the slicing, and every milestone file is buildable.
  - number: 4
    key: build
    name: Build
    ends_when: >
      The human stops asking for the next milestone.

# --------------------------------------------------------------- the numbers

policy:
  - key: stall_replies
    value: 4
    description: >
      Rounds of back-and-forth on one concern before the scribe hands it to the
      human with both positions.
  - key: stall_rounds_open
    value: 3
    description: >
      Rounds a concern may sit open with no new answer before the scribe
      escalates it.
  - key: report_every_rounds
    value: 10
    description: >
      How often the scribe reports round count and spend to the human when
      nothing material has happened.
  - key: appeals_per_decision
    value: 1
    description: How many times one agent may appeal the same decision.
  - key: human_cuts_own_requests
    value: 1
    description: >
      1 means only the human may defer or reject a requirement they asked for,
      including one derived from their own answers. 0 lets the PM cut it.
  - key: accept_needs_concerns_closed
    value: 1
    description: >
      1 means a requirement cannot be accepted while any concern it came from,
      or any concern about it, is still open. The raiser has to be satisfied
      before the wording becomes real. Deferring or rejecting is not blocked.
  - key: accept_needs_all_seen
    value: 1
    description: >
      1 means a requirement cannot be accepted until every active agent has
      read it in their queue (cp-queue --mark-seen), so each gets one chance
      to raise a concern first. The proposer and the decider are exempt.

# ------------------------------------------------------------ what agents do

# Valid duties. An agent's owns / rules_on / reviews / checks lists are
# validated against these, and the tools enforce them.
duties:
  - value: interview
    description: Asking the human what they want, and turning it into requirements.
  - value: requirements
    description: Ruling on proposed requirements — accept, defer, reject.
  - value: deliverables
    description: Proposing how the work splits into v1, v2 and later.
  - value: milestones
    description: Proposing how a deliverable splits into buildable milestones.
  - value: slicing
    description: Judging whether a milestone is buildable, self-contained and honors invariants.
  - value: architecture
    description: Designing against the whole requirement set and naming the invariants.
  - value: buildability
    description: Confirming a milestone file can be built from as written.
  - value: staffing
    description: Approving or declining a new agent joining the project.
  - value: reporting
    description: Telling the human what happened, and carrying escalations and appeals.
  - value: code
    description: Implementing a milestone.
  - value: testing
    description: Testing an implementation against its milestone file.
  - value: code_review
    description: Critiquing an implementation itself.

duty_relations:
  - value: owns
    description: Proposes it and is answerable for it.
  - value: rules_on
    description: Decides it when others disagree.
  - value: reviews
    description: Judges someone else's work on it and may send it back.
  - value: checks
    description: Confirms it is fit before the next phase starts.

# ------------------------------------------------------------- vocabularies

vocabularies:

  # What an agent is doing when it raises something.
  #   must_address — the only role this kind may be addressed to
  #   via_tool     — this kind is created by that tool, not by cp-concern
  #   about        — what the raiser must point at (--about R-12 or C-3): the
  #                  requirement or concern they read that prompted this.
  #                  none | requirement | concern | any. Only the brief, which
  #                  starts every trail, points at nothing.
  concern_kinds:
    - value: brief
      description: >
        The human's own description of what they want. Raised by the human,
        addressed to the PM. Usually concern #1; may be raised again when the
        human changes direction.
      must_address: pm
      about: none
    - value: question
      description: >
        Something the raiser does not know and cannot decide alone. Expects an
        answer from the addressee.
      about: any
    - value: risk
      description: >
        Something that could go wrong and is not yet addressed by any
        requirement. Expects either a new requirement or an explicit decision
        to accept the risk.
      about: any
    - value: objection
      description: >
        Disagreement with an existing requirement, decision or answer. Expects
        the requirement to change, or the objection to be overruled with a
        reason.
      about: any
    - value: proposal
      description: >
        A concrete suggestion for a requirement or an approach, put to another
        agent for agreement before it is proposed as a requirement.
      about: any
    - value: staffing
      description: >
        A request to bring another agent into the project. Goes to the human
        with what triggered it and what it will cost.
      must_address: human
      via_tool: cp-staff
      about: any
    - value: appeal
      description: >
        A formal challenge to a decision the PM made. Goes to the human, never
        back to the PM.
      must_address: human
      about: any

  concern_statuses:
    - value: open
      description: Awaiting an answer, or awaiting the raiser's review of one.
    - value: resolved
      description: The raiser marked the latest answer satisfactory.
    - value: withdrawn
      description: The raiser dropped it; no answer is needed.
    - value: escalated
      description: Handed to the human or the PM; the original addressee is done with it.

  # The shape of an answer.
  #   requires         — what the tool demands: requirements | reason | recipient
  #   document_section — where this answer shows up in requirements.md
  answer_kinds:
    - value: accepted
      description: >
        The answerer agrees and acted. Must name the requirement ids it created
        or changed.
      requires: requirements
    - value: rejected
      description: >
        The answerer disagrees and is changing nothing. Must give the reason;
        that reason is published, so write it for someone reading it later.
      requires: reason
      document_section: Accepted risks
    - value: escalated
      description: >
        The answerer cannot settle this. Must name who it goes to — the PM, or
        the human. The concern moves to them.
      requires: recipient

  # What a requirement is.
  #   decided_by       — the role that may rule on it (human, or pm)
  #   document_section — where an accepted one appears in requirements.md
  requirement_kinds:
    - value: goal
      description: >
        What the project is for, in one sentence. Everything else is judged
        against these.
      decided_by: human
      document_section: Goal and scope
    - value: non_goal
      description: >
        Something deliberately out of scope, recorded so it stops being
        re-proposed.
      decided_by: human
      document_section: Goal and scope
    - value: success_criterion
      description: How the human will know the project worked.
      decided_by: human
      document_section: Goal and scope
    - value: functional
      description: >
        Something the system does, stated so that it can be tested. One
        behavior per requirement.
      decided_by: pm
      document_section: Requirements
    - value: constraint
      description: >
        A limit the system must respect — security, compliance, performance,
        operational. Applies across features rather than describing one.
      decided_by: pm
      document_section: Cross-cutting rules
    - value: invariant
      description: >
        A decision later requirements depend on, expensive to change once code
        exists. The test is: if we skip this now and want it later, do we
        rewrite or just add? Rewrite means it is an invariant. Every milestone
        that touches one must honor it.
      decided_by: human
      document_section: Cross-cutting rules

  # in_document      — does a requirement in this status appear in the document
  # document_section — which section; empty means "the kind's own section"
  requirement_statuses:
    - value: proposed
      description: Raised but not yet ruled on.
      in_document: false
    - value: accepted
      description: In scope. Will be built in some deliverable.
      in_document: true
    - value: deferred
      description: Wanted, but not now. Parked against a later deliverable.
      in_document: true
      document_section: Deferred and cut
    - value: rejected
      description: Not being done. The reason is kept and shown.
      in_document: true
      document_section: Deferred and cut
    - value: superseded
      description: >
        Replaced by a reworded requirement, which points back via supersedes_id.
        Happens when the rewording is accepted; until then the original stays
        in force.
      in_document: false

  # set_by — the only role that may apply a cost flag
  cost_flags:
    - value: cheap
      description: Hours to a day. No new components or data-model change.
      set_by: architect
    - value: moderate
      description: Days. New components or changes to existing ones, but nothing structural.
      set_by: architect
    - value: expensive
      description: >
        Weeks, or it changes the data model, the trust boundary or the
        deployment shape. Anything the time-to-market agent should see before
        cutting scope.
      set_by: architect

  link_relations:
    - value: origin
      description: This concern is why the requirement exists.

  deliverable_statuses:
    - value: proposed
      description: Suggested by the agent who owns the split; not yet ruled on.
      in_document: false
    - value: planned
      description: Agreed and ordered, not started.
      in_document: true
    - value: building
      description: At least one of its milestones is under way.
      in_document: true
    - value: delivered
      description: All its milestones are merged and the human has tried it.
      in_document: true

  milestone_statuses:
    - value: proposed
      description: Suggested; the architect has not passed the slicing yet.
      in_document: false
    - value: planned
      description: Sliced, reviewed, its file written; not started.
      in_document: true
    - value: building
      description: The developer is implementing it.
      in_document: true
    - value: in_review
      description: With QA and code review.
      in_document: true
    - value: merged
      description: Both reviewers signed off and it is merged.
      in_document: true
    - value: accepted
      description: The human has tried it and is satisfied.
      in_document: true

# -------------------------------------------------------------- the roster
#
#   phases         — the pipeline phases this agent takes part in
#   joins_at_phase — the earliest phase it can be staffed into
#   join_trigger   — what has to appear before it is worth staffing
#   owns / rules_on / reviews / checks — its duties, enforced by the tools

agents:

  - id: 1
    name: The Human
    role: human
    motivation: >
      Owns the goal. Decides anything expensive to reverse, and settles what no
      one else can.
    phases: [1, 2, 3, 4]
    joins_at_phase: 1
    rules_on: [staffing]
    active: true
    joined_round: 1

  - id: 2
    name: Peter the Project Manager
    role: pm
    motivation: >
      Does this still serve the stated goal? Interviews the human, turns what
      they say into requirements, and rules on ordinary disagreements so the
      human does not have to.
    charter: .claude/agents/pm.md
    phases: [1, 2, 3]
    joins_at_phase: 1
    owns: [interview]
    rules_on: [requirements, deliverables, milestones]
    active: true
    joined_round: 1

  - id: 3
    name: The Scribe
    role: scribe
    motivation: >
      Has no opinions. Records what was decided, routes unclaimed concerns,
      spots stalls and duplicates, reports status to the human, and carries
      escalations and appeals.
    charter: .claude/agents/scribe.md
    phases: [1, 2, 3, 4]
    joins_at_phase: 1
    owns: [reporting]
    active: true
    joined_round: 1

  - id: 4
    name: Tina the Time-to-Market
    role: ttm
    motivation: >
      Ship something useful sooner. Cuts scope, resists gold-plating, and
      proposes the split into deliverables and milestones.
    charter: .claude/agents/ttm.md
    phases: [1, 3]
    joins_at_phase: 1
    join_trigger: a first feature list exists
    join_rationale: >
      Her question — what would you ship first if you could have only one thing
      — shapes the interview rather than following it.
    owns: [deliverables, milestones]

  - id: 5
    name: Arty the Architect
    role: architect
    motivation: >
      Will this hold together, and what must the first version not preclude?
    charter: .claude/agents/architect.md
    phases: [1, 2, 3]
    joins_at_phase: 1
    join_trigger: a first feature list exists
    join_rationale: >
      Deliberately early. He is the one whose late arrival is expensive:
      invariants decided after the features are settled mean rework.
    owns: [architecture]
    reviews: [slicing]

  - id: 6
    name: Quinn the QA
    role: qa
    motivation: What breaks it? Turns corner cases into requirements.
    charter: .claude/agents/qa.md
    phases: [1, 4]
    joins_at_phase: 1
    join_trigger: features are concrete
    join_rationale: >
      Corner cases usually surface missing features the human has to rule on,
      so they are worth finding before the architecture, not after.
    owns: [testing]

  - id: 7
    name: Ian the Infosec
    role: infosec
    motivation: Who can see or do what they should not?
    charter: .claude/agents/infosec.md
    phases: [1]
    joins_at_phase: 1
    join_trigger: personal data, login or permissions appear
    join_rationale: >
      Needs something concrete to attack. Before that he can only produce
      generic warnings that cost tokens every round.

  - id: 8
    name: Carla the Compliance Officer
    role: compliance
    motivation: What do law, regulation and policy demand — retention, privacy, audit?
    charter: .claude/agents/compliance.md
    phases: [1]
    joins_at_phase: 1
    join_trigger: regulated data appears (personal, time off, pay, medical, EU staff)
    join_rationale: >
      Expensive in constraints. The human should get to weigh the triggering
      requirement against the cost of a compliance pass before she joins.

  - id: 9
    name: Otto the Ops
    role: sre
    motivation: Will it survive real load, and can it be run and recovered?
    charter: .claude/agents/sre.md
    phases: [1]
    joins_at_phase: 1
    join_trigger: scale, refresh frequency or uptime expectations appear
    join_rationale: Needs numbers to reason about.

  - id: 10
    name: Uma the UX
    role: ux
    motivation: Can a real person actually accomplish the task?
    charter: .claude/agents/ux.md
    phases: [1]
    joins_at_phase: 1
    join_trigger: the interface is more than a list or a form
    join_rationale: Needs screens or workflows to critique.

  - id: 11
    name: Dana the Developer
    role: developer
    motivation: Build exactly this milestone, against its file.
    charter: .claude/agents/developer.md
    phases: [3, 4]
    joins_at_phase: 3
    join_trigger: milestone files are written
    join_rationale: >
      Kept out of the requirements loop: the architect covers feasibility, and a
      developer this early produces implementation detail instead of
      requirements.
    owns: [code]
    checks: [buildability]

  - id: 12
    name: Rita the Reviewer
    role: reviewer
    motivation: Is the implementation sound — quality, security, design?
    charter: .claude/agents/reviewer.md
    phases: [4]
    joins_at_phase: 4
    join_trigger: a milestone is implemented
    join_rationale: Reviews code, not plans.
    owns: [code_review]
